[result]
ok = "Completed"
partial = "Completed with pending changes"
failed = "Failed"
needs_confirmation = "Awaiting confirmation"
skipped = "Skipped"
cancelled = "Stopped"
paused = "Paused"

[notify.ok]
title = "Backup complete"
body = "{uploaded}, {updated}, and {trashed}."

[notify.partial]
title = "Some backup changes are still pending"
body = "Check the history to see which changes are pending and run the backup again."

[notify.failed]
title = "Backup interrupted"
body = "Check the history to see what happened before running the backup again."

[notify.needs_confirmation]
title = "Some items are ready to move to the trash"
body = "Run backup now --confirmar to review the list and decide whether to continue."

[notify.paused]
title = "Backup paused"
body = "Pending changes will resume with the next backup."

[notify.skipped]
title = "Backup skipped"
body = "Run backup doctor to see what kept the backup from starting."

[notify.uploaded]
one = "{count} file uploaded"
other = "{count} files uploaded"

[notify.updated]
one = "{count} file updated"
other = "{count} files updated"

[notify.trashed]
one = "{count} item moved to the trash"
other = "{count} items moved to the trash"

[notify.incomplete]
one = "{count} change is pending. Check the history and run the backup again."
other = "{count} changes are pending. Check the history and run the backup again."

