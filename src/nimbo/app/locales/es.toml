[notify.failed]
title = "El respaldo se interrumpió"
body = "Revisa el historial para saber qué pasó antes de volver a respaldar."

[notify.needs_confirmation]
title = "Hay elementos por enviar a la papelera"
body = "Ejecuta backup ahora --confirmar para revisar la lista y decidir si quieres continuar."

[notify.paused]
title = "Respaldo en pausa"
body = "Los cambios pendientes se retomarán en el próximo respaldo."

[notify.skipped]
