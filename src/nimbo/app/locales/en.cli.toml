[cli.parser]
usage = "Usage:"
options = "Options:"
positionals = "Arguments:"
invalid = "Invalid arguments. Run {prog} --help for usage."

[cli.command_help]
now = "Start a backup."
pending = "Preview the pending changes."
status = "Show backup and service status."
history = "Show recent backup runs."
undo = "Restore items from a run's Drive trash."
verify = "Verify Drive against your local files."
stop = "Stop the backup service safely."
install = "Set up Nimbo and its daily schedule."
connect = "Reconnect your Google account."
uninstall = "Remove the scheduled backup."
doctor = "Check your backup setup."
log = "Show the latest log records."
run = "Run the backup engine and report its result."

[cli.metavar]
path = "path"
id = "id"
secret = "secret"
number = "n"
run = "run"
folders = "a,b,c"
target = "url/id"
time = "hh:mm"

[cli.option]
help = "Show this help."
version = "Show the Nimbo version."
no_motion = "Reduce motion in terminal views."
language = "Select Spanish (es) or English (en)."
verbose = "Enable verbose backup logging."
here = "Run the backup in this terminal."
confirm = "Review and approve the latest pending deletions."
yes = "Approve the specific action requested by this command."
json = "Output versioned data for scripts."
count = "Show up to this many entries."
run_id = "Run number. Defaults to the latest run with trash records."
repair = "Apply the normal backup plan to repair differences."
auto = "Use a fresh manual request or mark the run as scheduled."
client_json = "Read a downloaded Google desktop client .json file."
client_id = "Set the Google desktop client ID."
client_secret = "Set the Google desktop client secret. Other local processes may see this value. Use --client-json or the hidden prompt."
source = "Set the source directory."
folders = "Select a comma-separated list of subfolders."
target = "Set the destination folder link or ID."
at = "Set the daily start time on a 24-hour clock."
unattended = "Use command-line settings without terminal prompts."
no_service = "Save the setup without installing systemd units."
purge = "Also remove the local settings, index, logs and stored token."
revoke = "Also revoke the stored credential at Google."

[cli.json_help]
status = "With --json, schema 1 includes config, last_run, service and folders. Missing configuration and runs use null. The configuration summarizes source, target, schedule, service and language."
pending = "With --json, schema 1 includes folders, totals, warnings, errors, scan_problems and brake. A folder lists upload and update (rel, size in bytes), move (from, to) and trash (rel, affected_files)."
history = "With --json, schema 1 includes runs, an array of backup summaries in reverse chronological order."

