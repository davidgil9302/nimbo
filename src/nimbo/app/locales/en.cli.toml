[doctor.config]
ok = "Configuration is valid."
bad = "Configuration is missing or invalid."
hint = "Run backup install or correct the configuration."

[doctor.keyring]
ok = "Credential storage is available."
bad = "Credential storage is unavailable."
hint = "Sign in to your desktop and unlock the keyring."

[doctor.token]
ok = "Google authorization is ready."
bad = "Google authorization could not be refreshed."
hint = "Run backup connect and approve access in your browser."

[doctor.api]
ok = "Google Drive responded."
bad = "Google Drive did not respond successfully."
hint = "Check your internet connection and Google account access."

[doctor.target]
ok = "Drive destination · {name}"
bad = "The Drive destination is missing, trashed or inaccessible."
hint = "Check the destination's link and permissions in Drive."

[doctor.source]
ok = "The source directory is available."
bad = "The source directory is missing or unmounted."
hint = "Connect the selected disk and open the source directory."

[doctor.sentinel]
ok = "The source marker is valid."
bad = "The source marker is missing or does not match."
hint = "Check that you connected the source selected during setup."

[doctor.folders]
ok = "The selected subfolders are available."
bad = "A selected subfolder is missing, empty or unreadable."
hint = "Check the selected subfolders and their permissions."

[doctor.units]
ok = "The systemd units are installed and the timer is enabled."
bad = "The daily service is unavailable or disabled."
hint = "Run backup install to enable scheduling, or use backup now for a manual backup."

[doctor.next]
ok = "Next scheduled backup · {time}"
bad = "There is no next scheduled backup."
hint = "Check that the Nimbo timer is enabled in your systemd user session."

[doctor.db]
ok = "The local index passed its integrity check."
bad = "The local index is missing, unreadable or damaged."
hint = "Check the Nimbo state directory and its permissions."

[doctor.no_run]
ok = "No backup runs have been recorded."
bad = "The latest run could not be read."
hint = "Keep a copy of the state database before investigating the record."

[doctor.last]
ok = "Latest backup · {result}"
bad = "Latest backup · {result}"
hint = "Run backup history to review the latest result."

[doctor.space]
ok = "Free space for local state · {space}"
bad = "Local state storage is full or unavailable."
hint = "Check storage and free some space in the state directory."

[doctor.version]
ok = "Nimbo version · {version}"
bad = "The Nimbo version is unavailable."
hint = "Check your Nimbo installation."
