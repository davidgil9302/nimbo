queued = "The backup has been queued."
fallback = "The backup service is unavailable. Nimbo is running in this terminal."
stopping = "Stopping safely"
stop_requested = "The service has stopped."
no_service_to_stop = "The backup service is unavailable."
confirm_next = "Run backup now --confirm to review the deletions."
no_confirmation = "The latest backup has no deletions awaiting confirmation."
confirmation_changed = "The deletion list has changed. Run backup now again to review a fresh list."
confirm_trash = "Move the listed items to the Drive trash?"
tui_unavailable = "The dashboard is unavailable. Run backup status to see your backup."
systemd_error = "The service operation failed. Run backup doctor to check your systemd user session."
local_error = "Nimbo could not read or write local data. Check the paths, permissions and available space."
client_secret_warning = "Other local processes may see the secret passed with --client-secret. Use --client-json or the hidden prompt."
live_metrics = "{phase} · {rate}/s · remaining {eta}"
run_line = "{result} · uploaded {uploaded} · updated {updated} · moved {moved} · trashed {trashed} · failed {failed}"
undo_line = "Untrashed {untrashed} · files restored {restored} · existing files kept {existing} · failed {failed}"
hooks_ignored = "Ignoring test overrides because the Drive origin must start with http://127.0.0.1 or http://localhost and include a port."
oauth_hook_ignored = "Ignoring the OAuth test override because its origin must use a local address and port."
unsafe_path = "A Nimbo state file points outside its configured directory. Review the symbolic link before continuing."
undo_other_mirror = "That run belongs to an earlier mirror setup. Review the old destination in Drive."
