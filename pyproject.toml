[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nimbo"
version = "0.1.0"
description = "Reliable mirror backups from Linux to Google Drive, with a modern terminal dashboard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "nimbo contributors" }]
keywords = ["backup", "google-drive", "mirror", "sync", "linux", "tui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = [
  "httpx>=0.27",
  "textual>=1.0",
  "secretstorage>=3.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "ruff>=0.5",
  "pytest-textual-snapshot>=1.0",
]

[project.scripts]
backup = "nimbo.app.cli:main"
nimbo = "nimbo.app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nimbo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not e2e'"
markers = [
  "slow: long-running tests (subprocess kills, soak runs)",
  "e2e: talks to the real Google Drive API (needs NIMBO_E2E_FOLDER_ID)",
]
timeout = 600

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "S", "BLE"]
ignore = ["S101", "S603", "S607", "PTH123"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["secretstorage.*", "jeepney.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["nimbo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
